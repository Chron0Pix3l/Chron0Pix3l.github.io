<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="dice-icon.png"><title>Untitled Dice Roller</title><style>:root{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--muted:#a0a0a0;--border:#333;--c4:#ff4d4d;--c6:#4da6ff;--c8:#4dff4d;--c10:#ffbc4d;--c12:#e64dff;--c20:#4dffff;--c100:#ff4d94}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}.app-container{width:100%;max-width:800px;display:flex;flex-direction:column}.header-row{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:30px;position:relative}.dropdown-container{position:relative;width:140px}.dropdown-toggle{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center}.dropdown-toggle::after{content:'▼';font-size:10px}.dropdown-container.open .dropdown-toggle::after{transform:rotate(180deg)}.dropdown-content{display:none;border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--card);max-height:240px;overflow-y:auto;position:absolute;top:38px;left:0;width:280px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:100}.dropdown-container.open .dropdown-content{display:flex;flex-direction:column;gap:10px}#history-log{list-style:none;padding:0;margin:0;max-height:150px;overflow-y:auto}#history-log li{padding:6px 0;border-bottom:1px dashed var(--border);font-size:.9rem}#history-log li:first-child{font-weight:500;color:#bb86fc}.empty-history{color:var(--muted);font-style:italic}.clear-btn{background:transparent;border:1px solid #ff4d4d;color:#ff4d4d;padding:6px;border-radius:4px;font-size:12px;font-weight:bold;cursor:pointer;width:100%;text-align:center;transition:background 0.2s,color 0.2s}.clear-btn:hover{background:#ff4d4d;color:#121212}h1{margin:0;font-size:1.8rem;text-align:right}.dice-btn-container{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:25px;justify-content:center;width:100%}.dice-btn-wrapper{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;position:relative;width:56px;height:56px}.dice-svg-icon{width:100%;height:100%;transition:transform .1s}.dice-btn-wrapper:active .dice-svg-icon{transform:scale(.85)rotate(-8deg)}.input-group{display:flex;gap:12px;margin-bottom:20px;width:100%}#dice-input{flex:1;padding:14px;font-size:16px;background:var(--card);border:2px solid var(--border);border-radius:8px;color:var(--text)}#dice-input:focus{outline:none;border-color:#bb86fc}#roll-btn{padding:0 30px;font-size:16px;font-weight:bold;background:#bb86fc;color:#121212;border:none;border-radius:8px;cursor:pointer;transition:background .2s}#roll-btn:hover{background:#9965df}.dice-board{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;margin:20px 0;min-height:80px;width:100%}.live-die-container{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.3) rotate(-180deg);animation:spiralIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards}@keyframes spiralIn{100%{opacity:1;transform:scale(1) rotate(0deg)}}.die-tag{position:absolute;top:14px;font-size:9px;font-weight:800;color:var(--muted);opacity:0.7;pointer-events:none;z-index:2;width:100%;text-align:center}.btn-tag{top:16px;font-size:10px}.die-val{position:absolute;bottom:10px;z-index:2;font-weight:900;font-size:16px;color:var(--text);pointer-events:none;text-shadow:0 0 4px #000}.total-display{font-size:1.8rem;font-weight:bold;margin-top:15px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:8px;text-align:center;color:#bb86fc;width:100%}</style></head><body><div class="app-container"><div class="header-row"><div class="dropdown-container" id="history-dropdown"><button class="dropdown-toggle" onclick="toggleDropdown()">History</button><div class="dropdown-content"><ul id="history-log"><li class="empty-history" id="empty-msg">No rolls yet.</li></ul><button type="button" class="clear-btn" onclick="clearHistory()">Clear History</button></div></div><h1>Untitled Dice Roller</h1></div><div class="dice-btn-container"><div class="dice-btn-wrapper" onclick="addDie('d4')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><polygon points="50,5 95,85 5,85" fill="#1e1e1e" stroke="var(--c4)" stroke-width="4"/></svg><div class="die-tag btn-tag">d4</div></div><div class="dice-btn-wrapper" onclick="addDie('d6')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="8" fill="#1e1e1e" stroke="var(--c6)" stroke-width="4"/></svg><div class="die-tag btn-tag">d6</div></div><div class="dice-btn-wrapper" onclick="addDie('d8')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><polygon points="50,5 95,50 50,95 5,50" fill="#1e1e1e" stroke="var(--c8)" stroke-width="4"/></svg><div class="die-tag btn-tag">d8</div></div><div class="dice-btn-wrapper" onclick="addDie('d10')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><polygon points="50,5 95,40 50,95 5,40" fill="#1e1e1e" stroke="var(--c10)" stroke-width="4"/></svg><div class="die-tag btn-tag" style="top:12px">d10</div></div><div class="dice-btn-wrapper" onclick="addDie('d12')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><polygon points="50,5 92,35 76,85 24,85 8,35" fill="#1e1e1e" stroke="var(--c12)" stroke-width="4"/></svg><div class="die-tag btn-tag">d12</div></div><div class="dice-btn-wrapper" onclick="addDie('d20')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><polygon points="50,5 92,28 92,72 50,95 8,72 8,28" fill="#1e1e1e" stroke="var(--c20)" stroke-width="4"/></svg><div class="die-tag btn-tag">d20</div></div><div class="dice-btn-wrapper" onclick="addDie('d100')"><svg class="dice-svg-icon" viewBox="0 0 100 100"><polygon points="50,5 95,40 50,95 5,40" fill="#1e1e1e" stroke="var(--c100)" stroke-width="4"/></svg><div class="die-tag btn-tag" style="top:12px">d100</div></div></div><div class="input-group"><input type="text" id="dice-input" placeholder="e.g., 2d6 + 1d13 + 4" autocomplete="off"><button type="button" id="roll-btn" onclick="processRoll()">ROLL</button></div><div class="dice-board" id="dice-board"></div><div class="total-display" id="total-output">TOTAL: 0</div></div><script>const diceSVGConfigs={4:'<polygon points="50,5 95,85 5,85" fill="#1e1e1e" stroke="var(--c4)" stroke-width="4"/>',6:'<rect x="10" y="10" width="80" height="80" rx="8" fill="#1e1e1e" stroke="var(--c6)" stroke-width="4"/>',8:'<polygon points="50,5 95,50 50,95 5,50" fill="#1e1e1e" stroke="var(--c8)" stroke-width="4"/>',10:'<polygon points="50,5 95,40 50,95 5,40" fill="#1e1e1e" stroke="var(--c10)" stroke-width="4"/>',12:'<polygon points="50,5 92,35 76,85 24,85 8,35" fill="#1e1e1e" stroke="var(--c12)" stroke-width="4"/>',20:'<polygon points="50,5 92,28 92,72 50,95 8,72 8,28" fill="#1e1e1e" stroke="var(--c20)" stroke-width="4"/>',100:'<polygon points="50,5 95,40 50,95 5,40" fill="#1e1e1e" stroke="var(--c100)" stroke-width="4"/>',circle:'<circle cx="50" cy="50" r="45" fill="#1e1e1e" stroke="#ffffff" stroke-width="4"/>'};function addDie(dieType){const input=document.getElementById("dice-input");let text=input.value.trim();const regex=new RegExp(`(\\d+)(${dieType})`,"i");if(regex.test(text)){text=text.replace(regex,(m,c,d)=>parseInt(c,10)+1+d)}else{text=text===""?`1${dieType}`:`${text} + 1${dieType}`}input.value=text}function toggleDropdown(){document.getElementById("history-dropdown").classList.toggle("open")}function clearHistory(){document.getElementById("history-log").innerHTML='<li class="empty-history" id="empty-msg">No rolls yet.</li>'}function processRoll(){const input=document.getElementById("dice-input");const output=document.getElementById("total-output");const board=document.getElementById("dice-board");const formula=input.value.trim();if(!formula)return;const partRegex=/([+-]?\s*\d+d\d+)|([+-]?\s*\d+)/gi;let match;let grandTotal=0;let historyStrings=[];let parsedFormula=formula.replace(/\s+/g,"");board.innerHTML="";let dieIndex=0;while((match=partRegex.exec(parsedFormula))!==null){let entry=match[0];if(entry.includes("d")||entry.includes("D")){let isNegative=entry.startsWith("-");let cleanEntry=entry.replace(/[+-]/g,"").toLowerCase();let splitArr=cleanEntry.split("d");let count=parseInt(splitArr[0],10)||1;let sides=parseInt(splitArr[1],10);let resultsArray=[];const shapeKey=diceSVGConfigs[sides]?sides:"circle";for(let i=0;i<count;i++){let rolledVal;if(sides===100){rolledVal=10*(Math.floor(Math.random()*10)+1)}else{rolledVal=Math.floor(Math.random()*sides)+1}resultsArray.push(rolledVal);grandTotal+=isNegative?-rolledVal:rolledVal;const dieContainer=document.createElement("div");dieContainer.className="live-die-container";dieContainer.style.animationDelay=`${0.08*dieIndex}s`;dieContainer.innerHTML=`<svg viewBox="0 0 100 100" style="width:100%;height:100%;">${diceSVGConfigs[shapeKey]}</svg><div class="die-tag" style="${sides===10||sides===100?'top:12px':''}">d${sides}</div><div class="die-val">?</div>`;board.appendChild(dieContainer);setTimeout(()=>{dieContainer.querySelector(".die-val").innerText=rolledVal},350+(0.08*dieIndex*1000));dieIndex++}historyStrings.push(`${isNegative?"-":""}[${resultsArray.join(", ")}]`)}else{let modifier=parseInt(entry,10);grandTotal+=modifier;historyStrings.push(modifier>=0?`+${modifier}`:`${modifier}`)}}if(dieIndex===0&&historyStrings.length===0){alert("Please enter valid dice notation.");return}output.innerText=`TOTAL: ${grandTotal}`;const log=document.getElementById("history-log");const emptyMsg=document.getElementById("empty-msg");if(emptyMsg)emptyMsg.remove();const logLi=document.createElement("li");logLi.innerText=`${formula} → ${historyStrings.join(" ")} = ${grandTotal}`;log.insertBefore(logLi,log.firstChild)}</script></body></html>
